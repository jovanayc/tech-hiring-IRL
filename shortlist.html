<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tech Hiring IRL: Candidates who attended</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=DM+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--ink:#0b0b0c;--mut:#5b5750;--or:#ff6a1a;--card:#fff;--line:#e4dfd6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.w{max-width:820px;margin:0 auto;padding:28px 18px 60px}.mark{font:800 18px Archivo,sans-serif}.mark b{color:var(--or)}
.e{color:var(--or);font:700 13px Archivo,sans-serif;letter-spacing:.16em;text-transform:uppercase;margin:26px 0 6px}
h1{font:800 clamp(28px,6vw,44px)/1.05 Archivo,sans-serif;margin:0 0 10px}.lead{color:var(--mut);margin:0 0 22px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 14px}
.c h2{font:800 22px Archivo,sans-serif;margin:0}.t{color:var(--mut);margin:2px 0 10px}
.pill{display:inline-block;font:600 12px "DM Sans",sans-serif;border-radius:99px;padding:3px 10px;margin:0 6px 6px 0;background:#f1ece3;color:#3a3630}
.pk{background:var(--or);color:#fff}.row a{display:inline-block;margin:6px 14px 0 0;color:#0b0b0c;font-weight:600;text-decoration:underline;text-decoration-color:var(--or);text-underline-offset:3px}
.x{margin:8px 0 0;color:#2b2823}.top{display:flex;align-items:center;gap:12px}.top h2{flex:1}.rk{background:var(--ink);color:#fff;border-radius:99px;min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font:800 14px Archivo,sans-serif}.meet{background:#1f9d55;color:#fff;border:0;border-radius:10px;padding:10px 14px;font:700 14px "DM Sans",sans-serif;cursor:pointer;white-space:nowrap;min-height:44px}.meet.on{background:#fff;color:#1f9d55;border:2px solid #1f9d55}.mr{display:inline-flex;align-items:center;gap:6px;background:#e6f5ec;color:#176b3c;border:1px solid #1f9d55;border-radius:99px;padding:4px 10px;font:700 13px "DM Sans",sans-serif;margin:0 0 8px}.c.req{border-left:5px solid #1f9d55}.cx{background:#fff;color:#8a2d1f;border:1px solid #d9b3ab;border-radius:10px;padding:8px 12px;font:600 13px "DM Sans",sans-serif;cursor:pointer;min-height:40px;margin-top:6px}.mdl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.mdl .bx{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:24px}.mdl h3{margin:0 0 8px;font:800 20px Archivo,sans-serif}.mdl p{margin:0 0 18px;color:#2b2823}.mdl .ac{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.mdl .ac button{border-radius:10px;padding:11px 16px;font:700 14px "DM Sans",sans-serif;cursor:pointer;min-height:44px;border:1px solid var(--line);background:#fff}.mdl .ac .go{background:#1f9d55;color:#fff;border-color:#1f9d55}.mdl .ac .no{background:#8a2d1f;color:#fff;border-color:#8a2d1f}.rkl{margin:0 0 8px;color:#3a3630;font:600 13px "DM Sans",sans-serif;background:#f1ece3;border-radius:8px;padding:6px 10px;display:inline-block}.ok{margin:8px 0 0;color:#176b3c;font-weight:600}.mv{margin:2px 0 6px;color:var(--mut);font-size:14px}.mv button{margin-left:6px;border:1px solid var(--line);background:#fff;border-radius:8px;width:44px;height:40px;font-size:16px;cursor:pointer}.mv button:disabled{opacity:.3}textarea{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}.sv{color:var(--or);font-weight:600;min-height:1.4em;margin:0 0 12px}.err,.ld{color:var(--mut)}
</style></head><body><div class="w"><div class="mark">The <b>{Dev}</b> Difference</div><div id="app"><p class="ld">Loading...</p></div></div>
<script>
const CFG = { url: "https://syndvtsdtpjbetzbzuzq.supabase.co", key: "sb_publishable_Y38ptqpz6_1jLgmFisG3fw_yvH69LiF" };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safe = u => /^https?:\/\//i.test(u || '') ? u : '';

function track(token) {
  try {
    const ua = navigator.userAgent || '', touch = (navigator.maxTouchPoints || 0) > 1;
    const form = /iPad|Tablet/i.test(ua) || (touch && /Macintosh/i.test(ua)) || (/Android/i.test(ua) && !/Mobile/i.test(ua)) ? 'tablet' : /iPhone|iPod|Android|Mobile/i.test(ua) ? 'phone' : 'laptop';
    const os = /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : /Android/i.test(ua) ? 'Android' : /Macintosh/i.test(ua) ? 'Mac' : /Windows/i.test(ua) ? 'Windows' : 'Other';
    let device = '', n = 1; try { device = localStorage.getItem('tdd-irl-device') || ''; if (!device) { device = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); localStorage.setItem('tdd-irl-device', device); } n = (parseInt(localStorage.getItem('tdd-sl-n-' + token) || '0', 10) || 0) + 1; localStorage.setItem('tdd-sl-n-' + token, String(n)); } catch (e) {}
    const visit = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    let secs = 0, clicks = [], dirty = true;
    const send = () => { try { fetch(CFG.url + '/rest/v1/rpc/log_shortlist', { method: 'POST', keepalive: true, headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ token, visit, payload: { seconds: secs, clicks: clicks.slice(0, 40), device, form, os, visitNo: n } }) }).catch(() => {}); dirty = false; } catch (e) {} };
    send();
    setInterval(() => { if (!document.hidden) { secs++; dirty = true; } if (secs % 10 === 0 && dirty && secs > 0) send(); }, 1000);
    document.addEventListener('visibilitychange', () => { if (document.hidden && dirty) send(); });
    window.addEventListener('pagehide', () => { if (dirty) send(); });
    document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[href]'); if (!a) return; const card = a.closest('.c');
      clicks.push({ k: /linkedin\.com/i.test(a.href) ? 'LinkedIn' : 'Portfolio', n: card ? String(card.dataset.n || '').slice(0, 60) : '', s: secs }); dirty = true; send(); }, true);
  } catch (e) {}
}
(async () => {
  const app = document.getElementById('app'), token = (location.hash || '').replace('#', '').trim();
  if (!token) { app.innerHTML = '<p class="err">This link is incomplete. Please use the full link from your email.</p>'; return; }
  try {
    const r = await fetch(CFG.url + '/rest/v1/rpc/company_shortlist', { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
    if (!r.ok) throw new Error('bad');
    const d = await r.json(); let list = d.candidates || []; const notes = {}, meet = {}; list.forEach(c => { if (c.note) notes[c.id] = c.note; if (c.meet) meet[c.id] = true; }); (d.absent || []).forEach(c => { if (c.meet) meet[c.id] = true; });
    let timer = null, status = d.savedAt ? 'Your saved ranking is shown.' : '';
    const persist = () => { status = 'Saving...'; paintStatus(); fetch(CFG.url + '/rest/v1/rpc/save_shortlist', { method: 'POST', keepalive: true, headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ token, payload: { order: list.map(c => c.id), notes, meet } }) }).then(x => { status = x.ok ? 'Saved. Our team can see your ranking and notes.' : 'Could not save. Check your connection and try again.'; paintStatus(); }).catch(() => { status = 'Could not save. Check your connection and try again.'; paintStatus(); }); };
    const later = () => { status = 'Saving...'; paintStatus(); clearTimeout(timer); timer = setTimeout(persist, 900); };
    const paintStatus = () => { const el = document.getElementById('st'); if (el) el.textContent = status; };
const mb = c => meet[c.id] ? '<span class="mr">\u2713 Meeting requested</span>' : '<button class="meet" data-meet="' + esc(c.id) + '">Set up next meeting</button>';
    const rk = c => (c.ranks && c.ranks.length) ? '<p class="rkl">Your team ranked this candidate: ' + c.ranks.map(x => esc(x.who) + ' #' + x.rank).join(' · ') + '</p>' : '';
    const mmsg = c => meet[c.id] ? '<p class="ok">Meeting requested. The Dev Difference team will reach out to set up the next meeting with ' + esc(c.first || 'them') + '.</p><button class="cx" data-unmeet="' + esc(c.id) + '">Cancel meeting request</button>' : '';
    const paint = () => {
      const picked = list.filter(c => c.picked).length;
      app.innerHTML = '<p class="e">Tech Hiring IRL · Chicago · Nov 12</p><h1>Candidates who attended</h1><p class="lead">Prepared for ' + esc(d.company) + '. ' + list.length + ' healthtech engineers met your team in person. They are listed in the order your team ranked them' + (picked ? ' (' + picked + ' ranked)' : '') + '. Use the arrows to change the order and add a note on anyone. Changes save automatically and go to our team. Tap LinkedIn to connect. Tap the green Set up next meeting button on anyone you want to meet again and confirm, and the Dev Difference team will reach out to set up that meeting. You can cancel a request at any time.</p><p class="sv" id="st">' + esc(status) + '</p>'
        + list.map((c, i) => '<div class="c' + (meet[c.id] ? ' req' : '') + '" data-n="' + esc((c.first || '') + ' ' + (c.last || '')) + '"><div class="top"><span class="rk">' + (i + 1) + '</span><h2>' + esc((c.first || '') + ' ' + (c.last || '')) + '</h2>' + mb(c) + '</div><p class="t">' + esc([c.title, c.company].filter(Boolean).join(' at ')) + '</p>' + rk(c) + '<div class="mv">Change order <button data-up="' + i + '" aria-label="Move up"' + (i === 0 ? ' disabled' : '') + '>&#9650;</button><button data-dn="' + i + '" aria-label="Move down"' + (i === list.length - 1 ? ' disabled' : '') + '>&#9660;</button></div>' + mmsg(c)
          + (c.picked ? '<span class="pill pk">Your team wants to keep talking</span>' : '') + (c.roles || []).map(x => '<span class="pill">' + esc(x) + '</span>').join('')
          + (c.experience ? '<p class="x">' + esc(c.experience) + '</p>' : (c.stack ? '<p class="x"><b>Works with:</b> ' + esc(c.stack) + '</p>' : ''))
          + '<div class="row">' + (safe(c.linkedin) ? '<a href="' + esc(safe(c.linkedin)) + '" target="_blank" rel="noopener">LinkedIn</a>' : '') + (safe(c.portfolio) ? '<a href="' + esc(safe(c.portfolio)) + '" target="_blank" rel="noopener">Portfolio</a>' : '') + '</div>'
          + '<textarea data-note="' + esc(c.id) + '" rows="2" placeholder="Add a note for our team (optional)">' + esc(notes[c.id] || '') + '</textarea></div>').join('')
        + ((d.absent || []).length ? '<p class="e" style="margin-top:34px">Not at the event</p><h1 style="font-size:clamp(22px,5vw,32px)">Completed assessment but wasn\'t able to make it to the event</h1><p class="lead">These candidates did the pre-work but could not attend, and we told them we would advocate for them with you. Tap LinkedIn to connect.</p>'
          + d.absent.map(c => '<div class="c' + (meet[c.id] ? ' req' : '') + '" data-n="' + esc((c.first || '') + ' ' + (c.last || '')) + '"><div class="top"><h2>' + esc((c.first || '') + ' ' + (c.last || '')) + '</h2>' + mb(c) + '</div><p class="t">' + esc([c.title, c.company].filter(Boolean).join(' at ')) + '</p>' + mmsg(c)
            + (c.roles || []).map(x => '<span class="pill">' + esc(x) + '</span>').join('')
            + (c.experience ? '<p class="x">' + esc(c.experience) + '</p>' : (c.stack ? '<p class="x"><b>Works with:</b> ' + esc(c.stack) + '</p>' : ''))
            + '<div class="row">' + (safe(c.linkedin) ? '<a href="' + esc(safe(c.linkedin)) + '" target="_blank" rel="noopener">LinkedIn</a>' : '') + (safe(c.portfolio) ? '<a href="' + esc(safe(c.portfolio)) + '" target="_blank" rel="noopener">Portfolio</a>' : '') + '</div></div>').join('') : '')
        + '<p class="lead" style="margin-top:22px">Questions or want an intro? Reply to the email this link came in.</p>';
    };
    const confirmBox = (title, msg, yes, cls, fn) => { const m = document.createElement('div'); m.className = 'mdl'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.innerHTML = '<div class="bx"><h3>' + title + '</h3><p>' + msg + '</p><div class="ac"><button data-x="n">Keep as is</button><button class="' + cls + '" data-x="y">' + yes + '</button></div></div>'; const close = () => m.remove(); m.addEventListener('click', ev => { const t = ev.target; if (t === m || (t.dataset && t.dataset.x === 'n')) close(); else if (t.dataset && t.dataset.x === 'y') { close(); fn(); } }); document.body.appendChild(m); const f = m.querySelector('[data-x=y]'); if (f) f.focus(); };
    app.addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled) return; if (b.dataset.meet || b.dataset.unmeet) { const id = b.dataset.meet || b.dataset.unmeet, add = !!b.dataset.meet; const c = list.concat(d.absent || []).find(x => x.id === id) || {}, nm = esc(((c.first || '') + ' ' + (c.last || '')).trim() || 'this candidate'); confirmBox(add ? 'Request a meeting with ' + nm + '?' : 'Cancel your meeting request for ' + nm + '?', add ? 'The Dev Difference team will reach out to set up the next meeting with ' + nm + '.' : 'We will not reach out to set up a meeting with ' + nm + '. You can request it again any time.', add ? 'Yes, request meeting' : 'Yes, cancel request', add ? 'go' : 'no', () => { if (add) meet[id] = true; else delete meet[id]; paint(); later(); }); return; } const up = b.dataset.up, dn = b.dataset.dn; const i = up != null ? +up : dn != null ? +dn : -1; if (i < 0) return; const k = up != null ? i - 1 : i + 1; if (k < 0 || k >= list.length) return; [list[i], list[k]] = [list[k], list[i]]; paint(); later(); });
    app.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.note) { const v = t.value.slice(0, 1000); if (v.trim()) notes[t.dataset.note] = v; else delete notes[t.dataset.note]; later(); } });
    paint();
    track(token);
  } catch (e) { app.innerHTML = '<p class="err">We could not open this link. Check that you used the full link from your email, or reply to us and we will resend it.</p>'; }
})();
</script></body></html>
