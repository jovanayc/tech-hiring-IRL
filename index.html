// Data layer for the no-login version: Supabase over plain web requests, checked every few seconds.
function makeSupaDb(cfg) {
  const base = cfg.url.replace(/\/+$/, '') + '/rest/v1';
  const H = { apikey: cfg.key, Authorization: 'Bearer ' + cfg.key, 'Content-Type': 'application/json' };
  const cache = new Map(), subs = [];
  let pass = null, loaded = false, queue = Promise.resolve(), onError = null, holdUntil = 0;
  const isPrivate = p => p.startsWith('private/') || p.startsWith('survey/');
  async function call(path, opt) {
    const r = await fetch(base + path, { headers: H, ...opt });
    if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) {} const err = new Error(m || 'Request failed (' + r.status + ')'); err.status = r.status; throw err; }
    if (r.status === 204) return null;
    const t = await r.text(); return t ? JSON.parse(t) : null;
  }
  const rpc = (fn, body) => call('/rpc/' + fn, { method: 'POST', body: JSON.stringify(body) });
  const docSnap = path => { const d = cache.get(path); return { id: path.split('/').pop(), exists: d !== undefined, data: () => d === undefined ? undefined : JSON.parse(JSON.stringify(d)), metadata: { fromCache: false, hasPendingWrites: false } }; };
  const colSnap = col => { const n = col.split('/').length + 1; const docs = [...cache.keys()].filter(k => k.startsWith(col + '/') && k.split('/').length === n).sort().map(docSnap); return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } }; };
  const sig = s => s.col ? JSON.stringify([...cache.entries()].filter(e => e[0].startsWith(s.path + '/'))) : JSON.stringify(cache.get(s.path) === undefined ? null : cache.get(s.path));
  function notify(force) { if (!loaded) return; for (const s of subs) { const g = sig(s); if (force || g !== s.sig) { s.sig = g; try { s.fn(s.col ? colSnap(s.path) : docSnap(s.path)); } catch (e) { console.error(e); } } } }
  function merge(rows, priv) { for (const k of [...cache.keys()]) if (isPrivate(k) === priv) cache.delete(k); for (const r of rows || []) cache.set(r.path, r.data); }
  async function poll() {
    if (Date.now() < holdUntil) return;            // let our own write land before reading again
    const started = Date.now();
    const pub = await call('/event_docs?select=path,data');
    const prv = pass ? await rpc('team_read', { pass }) : null;
    if (started < holdUntil) return;
    merge(pub, false); if (prv) merge(prv, true);
    const first = !loaded; loaded = true; notify(first);
  }
  async function loop() { try { await poll(); } catch (e) { if (onError) onError(e); } setTimeout(loop, document.hidden ? 12000 : 2500); }
  function write(ops) {
    for (const o of ops) o.op === 'delete' ? cache.delete(o.path) : cache.set(o.path, JSON.parse(JSON.stringify(o.data)));
    holdUntil = Date.now() + 4000; notify();
    const run = async () => {
      try {
        if (ops.length === 1 && ops[0].path.startsWith('survey/') && ops[0].op === 'set') await rpc('submit_survey', { person: ops[0].path.slice(7), payload: ops[0].data });
        else { if (!pass) throw new Error('Open the team console with the password first.'); await rpc('team_write', { pass, ops }); }
      } finally { holdUntil = 0; }
    };
    const p = queue.then(run); queue = p.catch(() => {}); return p;
  }
  let minted = 0;
  const doc = path => ({ id: path.split('/').pop(), path,
    get: async () => docSnap(path), set: data => write([{ op: 'set', path, data }]), delete: () => write([{ op: 'delete', path }]),
    update: data => write([{ op: 'set', path, data: { ...(cache.get(path) || {}), ...data } }]),
    onSnapshot: fn => { const s = { path, fn, col: false, sig: null }; subs.push(s); if (loaded) { s.sig = sig(s); fn(docSnap(path)); } return () => subs.splice(subs.indexOf(s), 1); } });
  const collection = path => ({ path, doc: id => doc(path + '/' + (id || 'p' + Date.now().toString(36) + (minted++).toString(36) + Math.random().toString(36).slice(2, 6))), get: async () => colSnap(path),
    onSnapshot: fn => { const s = { path, fn, col: true, sig: null }; subs.push(s); if (loaded) { s.sig = sig(s); fn(colSnap(path)); } return () => subs.splice(subs.indexOf(s), 1); } });
  return { doc, collection, start: errFn => { onError = errFn; loop(); },
    unlock: async p => { const rows = await rpc('team_read', { pass: p }); pass = p; merge(rows, true); notify(); },
    lock: () => { pass = null; } };
}

<script>
// Matching engine: groups are per company rep. Pure functions, no DOM.
const Engine = (() => {
  const LEVEL = { strong: 3, good: 2, weak: 1 };
  const key = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
  function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function roleScore(p, company) {
    const ov = (p.fit || {})[company.name];
    if (ov === 'strong') return 10; if (ov === 'good') return 5; if (ov === 'weak') return 0;
    if (!(p.roles || []).length) return 4;
    return p.roles.some(r => (company.wants || []).includes(r)) ? 10 : 0;
  }
  // null means this candidate must never be placed with this company
  function fitScore(p, company) {
    p = p || {};
    if ((p.blocks || []).includes(company.name)) return null;
    // stronger candidates get first call on a company that wants their role
    return roleScore(p, company) * (1 + 0.15 * ((LEVEL[p.level] || 2) - 1)) + (LEVEL[p.level] || 2);
  }
  function history(prior, repCompany) {
    const H = { rep: {}, comp: {}, pairs: new Set() };
    for (const r of prior || []) for (const s of r.stations || []) {
      const cs = s.cands || [];
      cs.forEach((c, i) => {
        (H.rep[c] = H.rep[c] || new Set()).add(s.rep);
        if (repCompany[s.rep]) (H.comp[c] = H.comp[c] || new Set()).add(repCompany[s.rep]);
        for (let j = i + 1; j < cs.length; j++) H.pairs.add(key(c, cs[j]));
      });
    }
    return H;
  }
  function context(o) {
    const companies = {}; for (const c of o.cfg.companies || []) companies[c.name] = c;
    const repCompany = {}; for (const r of o.reps) repCompany[r.id] = r.company;
    const comp = name => companies[name] || { name, wants: [] };
    const F = {};
    // A candidate with only one fitting company in the room gets priority for it
    for (const c of o.cands) {
      F[c.id] = {}; const p = o.priv[c.id] || {};
      const present = [...new Set(o.reps.map(r => r.company))];
      const n = present.filter(name => roleScore(p, comp(name)) > 0 && !(p.blocks || []).includes(name)).length;
      for (const name of present) { const f = fitScore(p, comp(name)); F[c.id][name] = f == null ? null : f + (roleScore(p, comp(name)) > 0 ? 4 / n : 0); }
    }
    return { F, H: history(o.prior, repCompany), comp, repCompany };
  }
  function buildGroups(o) {
    const { F, H, comp } = context(o);
    const warnings = [], unplaced = [];
    const reps = o.reps.slice();
    if (!reps.length) return { stations: [], unplaced: o.cands.map(c => c.id), warnings: [{ text: 'No company reps are checked in.' }] };
    const cands = [];
    for (const c of o.cands) {
      if (reps.every(r => F[c.id][r.company] == null)) { unplaced.push(c.id); warnings.push({ cand: c.id, text: 'blocked from every company in the room' }); }
      else cands.push(c.id);
    }
    const first = !(o.prior || []).length;
    const seedOf = id => first ? (o.priv[id] || {}).seed : null;
    const multi = {}; for (const r of reps) multi[r.company] = reps.filter(x => x.company === r.company).length > 1;
    const rolesOf = id => (o.priv[id] || {}).roles || [];
    const shares = (a, b) => rolesOf(a).some(r => rolesOf(b).includes(r));
    function cost(st) {
      let t = 0; const sums = {};
      for (const s of st) {
        let sum = 0;
        for (let i = 0; i < s.c.length; i++) {
          const c = s.c[i], f = F[c][s.company];
          if (f == null) { t += 1e5; continue; }
          t -= f; sum += f;
          if (seedOf(c) === s.rep) t -= 25;
          if (H.rep[c] && H.rep[c].has(s.rep)) t += 300; else if (H.comp[c] && H.comp[c].has(s.company)) t += 100;
          for (let j = i + 1; j < s.c.length; j++) {
            if (H.pairs.has(key(c, s.c[j]))) t += 15;
            if (multi[s.company] && shares(c, s.c[j])) t += 3;  // spread the same role across a company's reps
          }
        }
        if (s.c.length) (sums[s.company] = sums[s.company] || []).push(sum / s.c.length);
      }
      for (const k in sums) { const a = sums[k]; if (a.length > 1) t += Math.max(...a) - Math.min(...a); }
      return t;
    }
    const rand = rng(o.seedNum || 1);
    let best = null, bestCost = Infinity;
    for (let run = 0; run < 24; run++) {
      const order = cands.slice(); for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
      const st = reps.map(r => ({ rep: r.id, company: r.company, c: [] }));
      const off = Math.floor(rand() * st.length);
      order.forEach((c, i) => st[(i + off) % st.length].c.push(c));
      let cur = cost(st), improved = true, guard = 0;
      while (improved && guard++ < 200) {
        improved = false;
        for (let a = 0; a < st.length; a++) for (let b = 0; b < st.length; b++) {
          if (a === b) continue;
          const A = st[a].c, B = st[b].c;
          if (A.length > B.length) for (let i = 0; i < A.length; i++) {  // move keeps sizes balanced
            const c = A.splice(i, 1)[0]; B.push(c); const n = cost(st);
            if (n < cur - 1e-9) { cur = n; improved = true; break; } B.pop(); A.splice(i, 0, c);
          }
          if (a < b) for (let i = 0; i < A.length; i++) for (let j = 0; j < B.length; j++) {
            [A[i], B[j]] = [B[j], A[i]]; const n = cost(st);
            if (n < cur - 1e-9) { cur = n; improved = true; } else [A[i], B[j]] = [B[j], A[i]];
          }
        }
      }
      if (cur < bestCost) { bestCost = cur; best = st.map(s => ({ rep: s.rep, company: s.company, c: s.c.slice() })); }
    }
    for (const s of best) s.c = s.c.filter(c => { if (F[c][s.company] == null) { unplaced.push(c); warnings.push({ cand: c, text: 'could not be placed without breaking a block' }); return false; } return true; });
    const stations = best.map(s => ({ rep: s.rep, cands: s.c }));
    warnings.push(...review({ ...o, stations }));
    return { stations, unplaced, warnings, cost: bestCost };
  }
  // Plain-language notes on a set of groups, for the team preview
  function review(o) {
    const { F, H, comp, repCompany } = context(o); const out = [];
    for (const s of o.stations) {
      const company = repCompany[s.rep]; if (!company) continue;
      if (!s.cands.length) out.push({ rep: s.rep, text: 'has no candidates this round' });
      for (const c of s.cands) {
        if (!F[c]) continue;
        if (F[c][company] == null) out.push({ cand: c, text: 'is blocked from ' + company });
        else if (H.rep[c] && H.rep[c].has(s.rep)) out.push({ cand: c, text: 'is meeting the same rep again' });
        else if (H.comp[c] && H.comp[c].has(company)) out.push({ cand: c, text: 'is back with ' + company + ' (no other company fits or is free)' });
        else if (!(o.prior || []).length && roleScore(o.priv[c] || {}, comp(company)) === 0) out.push({ cand: c, text: 'has no role match with ' + company });
      }
    }
    return out;
  }
  // Late arrival: join the best-fit station with the fewest people, nobody else moves
  function placeLate(o, candId) {
    const { F, H, repCompany } = context({ ...o, cands: [{ id: candId }] });
    let best = null, bc = Infinity;
    for (const s of o.stations) {
      const company = repCompany[s.rep]; if (!company) continue;
      const f = F[candId][company]; if (f == null) continue;
      let t = s.cands.length * 8 - f;
      if (H.rep[candId] && H.rep[candId].has(s.rep)) t += 300; else if (H.comp[candId] && H.comp[candId].has(company)) t += 100;
      if (t < bc) { bc = t; best = s.rep; }
    }
    return best;
  }
  return { buildGroups, placeLate, review, fitScore };
})();
if (typeof module !== 'undefined') module.exports = Engine;
</script>
<script>
// Tech Hiring IRL: check-in, live groups per company rep, exit survey, team console.
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORS = [['Green', '#3ecf8e'], ['Blue', '#4da3ff'], ['Yellow', '#ffd23f'], ['Pink', '#ff7ac3'], ['Purple', '#a98bff'], ['Teal', '#2fd3d0'], ['Red', '#ff5d5d'], ['White', '#f3efe7']];
const ROLES = ['ML/AI', 'Full-stack', 'Software', 'Founding', 'Forward deployed', 'Security', 'QA'];
const DEFAULT_CFG = {
  minutes: 17,
  companies: [
    { name: 'Nestera', wants: ['Founding', 'Software'] },
    { name: 'Cofactor AI', wants: ['ML/AI', 'Full-stack', 'Forward deployed', 'Security'] },
    { name: 'CareLumi', wants: ['Full-stack'] }],
  prompts: ['What AI tool are you most excited about right now, and why?', 'What is the most interesting innovation in healthcare technology to you?'],
  goalCand: 'Leave knowing what is top of mind for this business and the challenges it is working through.',
  goalRep: 'Leave knowing a piece of work this person is proud of and the work they want to do next.'

const SUPA = (typeof window !== 'undefined' && window.TDD_SUPABASE) || null;  // set on the no-login build
const EV0 = { round: 0, endsAt: null, surveyOpen: false };
const S = { ready: false, admin: false, people: {}, priv: {}, rounds: {}, ev: { ...EV0 }, survey: {}, cfg: DEFAULT_CFG, me: null, draft: {}, ui: { tab: 'roster', open: null }, proposal: null, sel: null, kiosk: null, toast: '' };
try { S.me = localStorage.getItem('tdd-irl-me'); S.surveyDone = localStorage.getItem('tdd-irl-survey') === '1'; } catch (e) {}
// Console gate. Only a fingerprint of the password is kept in the page.
const PASS_MARK = '';  // not used on this build: the database checks the password
const fingerprint = s => { let h1 = 0xdeadbeef ^ 7, h2 = 0x41c6ce57 ^ 7; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); };
try { S.unlocked = sessionStorage.getItem('tdd-irl-unlock') === '1'; } catch (e) {}
const setLock = open => { S.unlocked = open; S.draft.pw = ''; S.pwErr = '';
  if (SUPA && !open) { S.admin = false; if (S.db) S.db.lock(); try { sessionStorage.removeItem('tdd-irl-pass'); } catch (e) {} }
  try { open ? sessionStorage.setItem('tdd-irl-unlock', '1') : sessionStorage.removeItem('tdd-irl-unlock'); } catch (e) {} };

/* ---------- data ---------- */
const toMap = snap => { const m = {}; for (const d of snap.docs) m[d.id] = { ...d.data(), id: d.id }; return m; };
const name = p => p ? (p.first + ' ' + p.last).trim() : 'Unknown';
const byName = (a, b) => name(a).localeCompare(name(b));

const curRound = () => S.rounds['r' + S.ev.round] || null;
const priorRounds = () => { const a = []; for (let i = 1; i <= S.ev.round; i++) if (S.rounds['r' + i]) a.push(S.rounds['r' + i]); return a; };
const engineInput = () => ({ cands: present('candidate').map(p => ({ id: p.id })), reps: present('rep').map(p => ({ id: p.id, company: p.company })), priv: S.priv, cfg: S.cfg });
async function save(fn) { try { await fn(); } catch (e) { S.toast = 'That did not save. ' + ((e && e.message) || 'Try again.'); render(); setTimeout(() => { S.toast = ''; render(); }, 5000); } }
const setPerson = (id, patch) => save(() => S.db.doc('people/' + id).set(strip({ ...S.people[id], ...patch })));
const setPriv = (id, patch) => save(() => S.db.doc('private/' + id).set(strip({ ...(S.priv[id] || {}), ...patch })));
const strip = o => { const c = JSON.parse(JSON.stringify(o)); delete c.id; return c; };
const setCfg = patch => save(() => S.db.doc('private/config').set(strip({ ...S.cfg, ...patch })));
const setEv = patch => save(() => S.db.doc('state/event').set({ ...S.ev, ...patch }));

async function boot() {
  render();
  const slow = setTimeout(() => { S.slow = true; render(); }, 10000);
  let db = null, user = null;
  if (SUPA) db = makeSupaDb(SUPA);
  else try { if (window.claude && window.claude.use) [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) {}
  S.db = db;
  if (!db) { clearTimeout(slow); S.nodb = true; render(); return; }
  if (!SUPA) try { S.admin = !!(user && (await user.canEdit() || await user.isOwner())); } catch (e) {}
  const fail = () => { clearTimeout(slow); S.slow = true; requestRender(); };
  if (SUPA) {
    S.unlocked = false; let saved = null; try { saved = sessionStorage.getItem('tdd-irl-pass'); } catch (e) {}
    if (saved) try { await db.unlock(saved); S.admin = S.unlocked = true; } catch (e) {}
    db.start(() => { if (!S.ready) { S.slow = true; requestRender(); } });
  }
  db.collection('people').onSnapshot(s => { S.people = toMap(s); S.ready = true; S.slow = false; clearTimeout(slow); requestRender(); }, fail);
  db.collection('rounds').onSnapshot(s => { S.rounds = toMap(s); requestRender(); }, fail);
  db.doc('state/event').onSnapshot(d => { S.ev = { ...EV0, ...(d.exists ? d.data() : {}) }; requestRender(); }, fail);
  if (S.admin || SUPA) {
    db.collection('private').onSnapshot(s => { S.priv = toMap(s); S.cfg = { ...DEFAULT_CFG, ...(S.priv.config || {}) }; delete S.cfg.id; requestRender(); }, fail);
    db.collection('survey').onSnapshot(s => { S.survey = toMap(s); requestRender(); }, fail);
  }
  render();
}

function tick() {

    if (!end) { el.textContent = ''; return; }
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    el.textContent = left ? Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : 'Time. Wrap up and wait for your next group.';
  });
}

function goCard(me, rd, st) {
  const rep = S.people[st.rep], col = colorOf(rep), isRep = me.id === st.rep;
  const others = st.cands.filter(id => id !== me.id);
  let h = '<div class="go stack" style="--c:' + col[1] + '"><p class="eyebrow">Round ' + rd.n + '</p>';
  h += isRep ? '<p class="muted">Your station is</p><div class="color">' + col[0] + '</div><h3>Your group this round</h3>' + chips(st.cands)
    : '<p class="muted">Go to the</p><div class="color">' + col[0] + ' station</div><h2>You\'re meeting ' + esc(name(rep)) + '</h2><p class="muted">' + esc(rep ? rep.company : '') + '</p>'
      + (others.length ? '<h3>Also in your group</h3>' + chips(others) : '');
  h += '</div>';
  h += '<div class="card stack"><p class="eyebrow">Start with this</p><h2>' + esc(rd.prompt || '') + '</h2><p class="muted">Everyone answers, about two minutes in total.</p>'
    + '<p class="note">' + esc(isRep ? rd.goalRep : rd.goalCand) + '</p></div>';

function findMe() {
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[^a-z]/g, '');
  const f = norm(S.draft.ff), l = norm(S.draft.fl);
  if (!f || !l) { S.findErr = 'Enter your first and last name.'; return render(); }
  const all = Object.values(S.people);
  let hits = all.filter(p => norm(p.first) === f && norm(p.last) === l);
  if (!hits.length) hits = all.filter(p => norm(p.last) === l && (norm(p.first).startsWith(f) || f.startsWith(norm(p.first))));
  if (hits.length === 1) { S.me = hits[0].id; S.findErr = ''; try { localStorage.setItem('tdd-irl-me', S.me); } catch (e) {} }
  else S.findErr = hits.length ? 'More than one person matches that name. Please see the check-in desk.' : 'We couldn\'t find that name. Check the spelling, or see the check-in desk.';
  render();
}

      + (late.length ? '<div class="stack"><h3>Checked in after this round was sent</h3>' + late.map(p => '<div class="row"><span class="grow">' + esc(name(p)) + '</span><button data-act="late" data-id="' + p.id + '">Add to best open station</button></div>').join('') + '</div>' : '')
      + (lostReps.length ? '<p class="note small">' + lostReps.map(s => esc(name(S.people[s.rep]))).join(', ') + ' is no longer checked in. Build the next round to regroup around the reps who are here.</p>' : '')
      + '<div class="row"><button data-act="timer">' + (S.ev.endsAt ? 'Restart' : 'Start') + ' the ' + S.cfg.minutes + ' minute timer</button>' + (S.ev.endsAt ? '<button data-act="stoptimer">Clear timer</button>' : '')
      + '<button class="danger" data-act="undo">' + (S.ui.undo ? 'Tap again to take round ' + rd.n + ' off phones' : 'Undo round ' + rd.n) + '</button></div></div>';
  }
  h += '<div class="card row" style="margin-top:14px;justify-content:space-between"><div class="grow"><h3>Exit survey reminder</h3><p class="small muted">Shows a "stop at the exit table" card on every phone.</p></div><button data-act="surveyopen" class="' + (S.ev.surveyOpen ? 'primary' : '') + '">' + (S.ev.surveyOpen ? 'Showing. Tap to hide' : 'Show on phones') + '</button></div>';
  return h;
}
function tabCompanies() {
  let h = '<div class="card stack"><h2>Companies and what they are hiring for</h2><p class="small muted">Matching sends candidates to companies that want one of their roles. Changes save as you tap.</p>';
  h += S.cfg.companies.map((c, i) => '<div class="edit stack"><div class="row" style="justify-content:space-between"><h3>' + esc(c.name) + '</h3><button class="ghost danger small" data-act="delco" data-id="' + i + '">Remove</button></div>' + toggles('want', i, ROLES, c.wants || []) + '</div>').join('');
  h += '<form class="row" data-form="addco"><label class="grow">New company<input id="co-name" data-draft="co" value="' + dv('co') + '"></label><button type="submit">Add company</button></form></div>';
  h += '<form class="card stack" style="margin-top:14px" data-form="prompts"><h2>Round settings</h2>'
    + '<label>Minutes per round<input id="cfg-min" type="number" min="1" max="60" value="' + esc(S.draft.min || S.cfg.minutes) + '" data-draft="min"></label>'
    + '<label>Round 1 icebreaker<textarea id="cfg-p1" data-draft="p1">' + esc(S.draft.p1 != null ? S.draft.p1 : S.cfg.prompts[0] || '') + '</textarea></label>'
    + '<label>Round 2 icebreaker<textarea id="cfg-p2" data-draft="p2">' + esc(S.draft.p2 != null ? S.draft.p2 : S.cfg.prompts[1] || '') + '</textarea></label>'
    + '<label>What candidates should walk away with<textarea id="cfg-gc" data-draft="gc">' + esc(S.draft.gc != null ? S.draft.gc : S.cfg.goalCand) + '</textarea></label>'
    + '<label>What reps should walk away with<textarea id="cfg-gr" data-draft="gr">' + esc(S.draft.gr != null ? S.draft.gr : S.cfg.goalRep) + '</textarea></label>'
    + '<div><button class="primary" type="submit">Save round settings</button></div></form>';
  return h;
}
function tabSurvey() {
  const sv = Object.values(S.survey), ratings = sv.map(s => s.rating).filter(Boolean);
  let h = '<div class="card stack"><h2>Who wants to keep talking</h2><p class="small muted">' + sv.length + ' surveys in' + (ratings.length ? ' · average event rating ' + (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1) + ' of 5' : '') + '. Picks are ranked, with #1 as the top choice. A candidate shows under a company when one of its reps picked them.</p>';
  if (!sv.length) return h + '<p class="muted">No surveys yet. Open the exit survey table view on a tablet by the door.</p></div>';
  for (const co of S.cfg.companies) {
    const picks = {};
    for (const s of sv) { const rep = S.people[s.id]; if (rep && rep.type === 'rep' && rep.company === co.name) (s.picks || []).forEach((c, i) => (picks[c] = picks[c] || []).push({ who: rep.first, rank: i + 1 })); }
    const candRank = {}; for (const s of sv) if (S.people[s.id] && S.people[s.id].type === 'candidate' && (s.picks || []).includes(co.name)) candRank[s.id] = s.picks.indexOf(co.name) + 1;
    const wantsCo = Object.keys(candRank), best = c => Math.min(...picks[c].map(x => x.rank));
    h += '<div class="edit stack"><h3>' + esc(co.name) + '</h3>' + (Object.keys(picks).length ? Object.keys(picks).sort((x, y) => best(x) - best(y)).map(c => '<div class="row"><span class="grow"><b>' + esc(name(S.people[c])) + '</b> <span class="small muted">' + esc(picks[c].map(x => x.who + '\'s #' + x.rank).join(', ')) + '</span></span>' + (wantsCo.includes(c) ? '<span class="pill ok">mutual, ranked this company #' + candRank[c] + '</span>' : '<span class="pill">company only</span>') + '</div>').join('') : '<p class="small muted">No picks from this company yet.</p>');
    const only = wantsCo.filter(c => !picks[c]);
    if (only.length) h += '<p class="small muted">Interested candidates the company did not pick: ' + esc(only.map(c => name(S.people[c]) + ' (their #' + candRank[c] + ')').join(', ')) + '</p>';
    h += '</div>';
  }
  for (const [k, title] of [['thoughts', 'What they thought of the event'], ['comment', 'Anything else they shared']]) {
    const notes = sv.filter(s => s[k]);
    if (notes.length) h += '<div class="stack"><h3>' + title + '</h3>' + notes.map(s => '<p class="note small"><b>' + esc(name(S.people[s.id])) + ':</b> ' + esc(s[k]) + '</p>').join('') + '</div>';
  }
  return h + '</div>';
}

/* ---------- exit survey table (runs on a team device) ---------- */
function viewKiosk() {
  let h = '<div class="narrow stack">' + mark('Exit survey');
  if (S.nodb || !S.ready) return h + waiting() + '</div>';
  const personal = !S.admin && !S.kioskOk;
  if (personal) {
    const mine = S.people[S.me];
    if (!SUPA) return h + '<div class="card"><p>The exit survey runs on the tablet at the exit table. ' + link('', 'Back to your group') + '</p></div></div>';
    if (!mine || !mine.checkedIn || mine.type === 'guest') return h + '<div class="card"><p>Find your name and check in at the desk first. ' + link('', 'Back') + '</p></div></div>';
    if (!S.kiosk || (S.kiosk.who !== mine.id && !S.kiosk.done)) S.kiosk = { who: mine.id, picks: [], none: false, rating: 0 };
  }
  const K = S.kiosk;
  if (K && K.done) return h + '<div class="card stack"><h1>Thank you</h1><p class="muted">We\'ll follow up with your intros. Get home safe.</p><button class="primary big" data-act="knext">' + (personal ? 'Back to my page' : 'Next person') + '</button></div></div>';
  if (!K) {
    const todo = Object.values(S.people).filter(p => p.checkedIn && p.type !== 'guest' && !S.survey[p.id]).sort(byName);
    return h + '<p class="eyebrow">20 seconds</p><h1>Tap your name</h1><div class="stack">' + (todo.length ? todo.map(p => '<button class="big" data-act="kwho" data-id="' + p.id + '">' + esc(name(p)) + '</button>').join('') : '<p class="muted">Everyone who checked in has answered.</p>') + '</div><p class="small">' + link('console', 'Back to the console') + '</p></div>';
  }
  const me = S.people[K.who], isRep = me.type === 'rep';
  const opts = isRep ? present('candidate').map(p => [p.id, name(p)]) : [...new Set(present('rep').map(r => r.company))].map(co => [co, co + ' (' + present('rep').filter(r => r.company === co).map(r => r.first).join(' and ') + ')']);
  h += '<h1>' + esc(me.first) + ', who do you want to keep talking to?</h1><p class="muted">Tap them in order, starting with your top pick. Tap a name again to take it off your list. ' + (isRep ? 'Answer for yourself, not for your whole team.' : 'We only share this with the team at The Dev Difference.') + '</p><div class="stack">'
    + opts.map(o => { const rk = K.picks.indexOf(o[0]) + 1; return '<button class="big rank' + (rk ? ' primary' : '') + '" data-act="kpick" data-id="' + esc(o[0]) + '"><span class="num">' + (rk || '') + '</span><span>' + esc(o[1]) + '</span></button>'; }).join('')
    + '<button class="big' + (K.none ? ' primary' : '') + '" data-act="knone">No one this time</button></div>'
    + '<div class="stack"><h3>How was tonight?</h3><div class="row stars">' + [1, 2, 3, 4, 5].map(i => '<button class="' + (K.rating === i ? 'on' : '') + '" data-act="krate" data-id="' + i + '" aria-label="' + i + ' of 5">' + i + '</button>').join('') + '</div>'
    + '<label>What did you think of this event?<textarea id="k-comment" data-draft="kc">' + dv('kc') + '</textarea></label>'
    + '<label>Anything else you\'d like to share? Feedback, comments, praise, anything.<textarea id="k-other" data-draft="ko">' + dv('ko') + '</textarea></label></div>'
    + '<div class="row"><button class="primary big" data-act="ksend"' + (K.picks.length || K.none ? '' : ' disabled') + '>Send</button><button class="ghost" data-act="knext">Cancel</button></div></div>';
  return h;
}

/* ---------- actions ---------- */
const nextColor = () => { const used = list('rep').map(r => r.color || 0); for (let i = 0; i < COLORS.length; i++) if (!used.includes(i)) return i; return list('rep').length % COLORS.length; };
async function addPerson(first, last, type, company, pv, extra) {
  const ref = S.db.collection('people').doc();
  const p = { first, last, type, checkedIn: false, ...(extra || {}) };
  if (type === 'rep') { p.company = company || ''; p.color = nextColor(); }
  S.people[ref.id] = { ...p, id: ref.id };
  await ref.set(p);
  if (pv) await S.db.doc('private/' + ref.id).set(pv);
  return ref.id;
}
const SAMPLE = [['Avery', 'Cole', ['ML/AI'], 'strong'], ['Blake', 'Ito', ['ML/AI'], 'good'], ['Casey', 'Okafor', ['Full-stack'], 'strong'], ['Devon', 'Park', ['Full-stack'], 'good'], ['Emery', 'Shah', ['Software'], 'strong'], ['Finley', 'Ross', ['Founding', 'Software'], 'good'], ['Gray', 'Nunez', ['Forward deployed'], 'strong'], ['Harper', 'Lin', ['Security'], 'good'], ['Indra', 'Moss', ['Full-stack'], 'weak'], ['Jules', 'Abara', ['Software'], 'good'], ['Kai', 'Brandt', ['QA'], 'good']];
const act = {
  tab: d => { S.ui.tab = d.id; render(); },
  lock: () => { setLock(false); render(); },
  tosurvey: () => { setLock(false); S.kioskOk = true; nav('survey'); },
  nav: d => nav(d.id || ''),
  notme: () => { S.me = null; try { localStorage.removeItem('tdd-irl-me'); } catch (e) {} render(); },
  open: d => { S.ui.open = S.ui.open === d.id ? null : d.id; S.ui.del = null; render(); },
  checkin: d => { const p = S.people[d.id]; setPerson(d.id, p.checkedIn ? { checkedIn: false, at: null } : { checkedIn: true, left: false, at: new Date().toISOString() }); },
  left: d => setPerson(d.id, { left: !S.people[d.id].left }),
  del: d => { if (S.ui.del !== d.id) { S.ui.del = d.id; return render(); } S.ui.del = S.ui.open = null; save(async () => { await S.db.doc('people/' + d.id).delete(); await S.db.doc('private/' + d.id).delete(); }); },
  role: d => { const cur = (S.priv[d.id] || {}).roles || []; setPriv(d.id, { roles: cur.includes(d.v) ? cur.filter(x => x !== d.v) : [...cur, d.v] }); },
  block: d => { const cur = (S.priv[d.id] || {}).blocks || []; setPriv(d.id, { blocks: cur.includes(d.v) ? cur.filter(x => x !== d.v) : [...cur, d.v] }); },
  one: d => setPriv(d.id, { [d.k]: (S.priv[d.id] || {})[d.k] === d.v ? null : d.v }),
  want: d => { const cs = JSON.parse(JSON.stringify(S.cfg.companies)), c = cs[+d.id]; c.wants = (c.wants || []).includes(d.v) ? c.wants.filter(x => x !== d.v) : [...(c.wants || []), d.v]; setCfg({ companies: cs }); },
  delco: d => setCfg({ companies: S.cfg.companies.filter((c, i) => i !== +d.id) }),
  sample: () => save(async () => {
    const repNames = [['Noor', 'Reyes'], ['Nico', 'Hale'], ['Cam', 'Ortiz'], ['Cleo', 'Vance'], ['Kit', 'Larsen'], ['Remy', 'Stone'], ['Sol', 'Adair'], ['Tate', 'Quinn']]; let k = 0;
    for (const co of S.cfg.companies) for (const i of (co.name === 'CareLumi' ? [1] : [1, 2])) { const nm = repNames[k++ % repNames.length]; await addPerson(nm[0], nm[1], 'rep', co.name, null, { sample: true }); }
    for (const s of SAMPLE) await addPerson(s[0], s[1], 'candidate', '', { roles: s[2], level: s[3], status: 'approved', integrity: 'clear' }, { sample: true });
  }),
  unsample: () => save(async () => { for (const p of Object.values(S.people).filter(p => p.sample)) { await S.db.doc('people/' + p.id).delete(); await S.db.doc('private/' + p.id).delete(); } }),
  bulk: () => save(async () => {
    for (const line of (S.draft.bulk || '').split('\n').map(l => l.trim()).filter(Boolean)) {
      const parts = line.split(',').map(x => x.trim()), nm = parts[0].split(/\s+/);
      if (nm.length < 2) continue;
      const roles = (parts[1] || '').split(';').map(x => x.trim()).map(x => ROLES.find(r => r.toLowerCase() === x.toLowerCase())).filter(Boolean);
      const level = ['strong', 'good', 'weak'].includes((parts[2] || '').toLowerCase()) ? parts[2].toLowerCase() : null;
      await addPerson(nm[0], nm.slice(1).join(' '), 'candidate', '', { roles, level, status: 'approved' });
    }
    S.draft.bulk = ''; render();
  }),
  build: () => { S.shuffle = (S.shuffle || 0) + 1; S.sel = null; S.proposal = Engine.buildGroups({ ...engineInput(), prior: priorRounds(), seedNum: S.ev.round * 100 + S.shuffle }); render(); },
  discard: () => { S.proposal = null; S.sel = null; render(); },
  pick: d => { S.sel = S.sel === d.id ? null : d.id; render(); },
  moveto: d => { for (const s of S.proposal.stations) s.cands = s.cands.filter(c => c !== S.sel); S.proposal.stations.find(s => s.rep === d.id).cands.push(S.sel); S.proposal.unplaced = S.proposal.unplaced.filter(c => c !== S.sel); S.sel = null; render(); },
  publish: () => save(async () => {
    const n = S.ev.round + 1, P = S.proposal;
    await S.db.doc('rounds/r' + n).set({ n, at: new Date().toISOString(), prompt: S.cfg.prompts[(n - 1) % S.cfg.prompts.length] || '', goalCand: S.cfg.goalCand, goalRep: S.cfg.goalRep, stations: P.stations.map(s => ({ rep: s.rep, cands: s.cands })) });
    await S.db.doc('state/event').set({ ...S.ev, round: n, endsAt: null });
    S.proposal = null; S.sel = null; S.shuffle = 0; render();
  }),
  late: d => { const rd = curRound(), rep = Engine.placeLate({ ...engineInput(), stations: rd.stations, prior: priorRounds().filter(r => r.n !== rd.n) }, d.id);
    if (!rep) { S.toast = 'No open station fits this person. Add them by hand in the next round.'; return render(); }
    save(() => S.db.doc('rounds/r' + rd.n).set(strip({ ...rd, stations: rd.stations.map(s => s.rep === rep ? { rep: s.rep, cands: [...s.cands, d.id] } : s) }))); },
  timer: () => setEv({ endsAt: new Date(Date.now() + S.cfg.minutes * 60000).toISOString() }),
  stoptimer: () => setEv({ endsAt: null }),
  undo: () => { if (!S.ui.undo) { S.ui.undo = true; return render(); } S.ui.undo = false; const n = S.ev.round; save(async () => { await S.db.doc('state/event').set({ ...S.ev, round: n - 1, endsAt: null }); await S.db.doc('rounds/r' + n).delete(); }); },
  surveyopen: () => setEv({ surveyOpen: !S.ev.surveyOpen }),
  kwho: d => { S.kiosk = { who: d.id, picks: [], none: false, rating: 0 }; S.draft.kc = S.draft.ko = ''; render(); },
  kpick: d => { const K = S.kiosk; K.none = false; K.picks = K.picks.includes(d.id) ? K.picks.filter(x => x !== d.id) : [...K.picks, d.id]; render(); },
  knone: () => { S.kiosk.none = !S.kiosk.none; S.kiosk.picks = []; render(); },
  krate: d => { S.kiosk.rating = +d.id; render(); },
  knext: () => { const back = !S.admin && !S.kioskOk; S.kiosk = null; back ? nav('') : render(); },
  ksend: () => save(async () => { const K = S.kiosk; await S.db.doc('survey/' + K.who).set({ type: S.people[K.who].type, picks: K.picks, none: K.none, rating: K.rating || null, thoughts: (S.draft.kc || '').trim(), comment: (S.draft.ko || '').trim(), at: new Date().toISOString() }); if (K.who === S.me) { S.surveyDone = true; try { localStorage.setItem('tdd-irl-survey', '1'); } catch (e) {} } S.kiosk = { done: true }; S.draft.kc = S.draft.ko = ''; render(); })
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const f = act[b.dataset.act]; if (f) f(b.dataset); });
document.addEventListener('change', e => {
  const d = e.target.dataset; if (!d || !d.change) return; const v = e.target.value;
  if (d.change === 'repco') setPerson(d.id, { company: v });
  if (d.change === 'repcolor') setPerson(d.id, { color: +v });
  if (d.change === 'score') setPriv(d.id, { score: v === '' ? null : +v });
  if (d.change === 'seed') setPriv(d.id, { seed: v || null });
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target.dataset.form;
  if (f === 'find') findMe();
  if (f === 'unlock') {
    const pw = (S.draft.pw || '').trim(); if (document.activeElement) document.activeElement.blur();
    if (!SUPA) { if (fingerprint(pw) === PASS_MARK) setLock(true); else { S.pwErr = 'That password is not right. Try again.'; S.draft.pw = ''; } return render(); }
    S.db.unlock(pw).then(() => { setLock(true); S.admin = true; try { sessionStorage.setItem('tdd-irl-pass', pw); } catch (e) {} render(); })
      .catch(e => { S.pwErr = e && e.status && e.status !== 403 && e.status !== 401 && !/wrong password/.test(e.message) ? 'Could not reach the event data. Check the connection and try again.' : 'That password is not right. Try again.'; S.draft.pw = ''; render(); });
  }
  if (f === 'add') { const first = (S.draft.af || '').trim(), last = (S.draft.al || '').trim(), type = S.draft.at || 'candidate';
    if (!first || !last) { S.toast = 'Enter a first and last name.'; render(); return setTimeout(() => { S.toast = ''; render(); }, 3000); }
    S.draft.af = S.draft.al = ''; save(() => addPerson(first, last, type, S.draft.ac || '', type === 'candidate' ? { status: 'approved' } : null)); if (document.activeElement) document.activeElement.blur(); render(); }
  if (f === 'addco') { const n = (S.draft.co || '').trim(); if (n && !S.cfg.companies.some(c => c.name === n)) { S.draft.co = ''; setCfg({ companies: [...S.cfg.companies, { name: n, wants: [] }] }); if (document.activeElement) document.activeElement.blur(); } }
  if (f === 'prompts') { const g = (k, fb) => (S.draft[k] != null ? S.draft[k] : fb); setCfg({ minutes: Math.max(1, +g('min', S.cfg.minutes) || 17), prompts: [g('p1', S.cfg.prompts[0]), g('p2', S.cfg.prompts[1])], goalCand: g('gc', S.cfg.goalCand), goalRep: g('gr', S.cfg.goalRep) }); if (document.activeElement) document.activeElement.blur(); }
});
boot();
</script>
